<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>כניסה לגן מזור</title>
  <link rel="stylesheet" href="styles.css">
  <style>body{display:grid;place-items:center;min-height:100vh;padding:20px}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--border);border-radius:26px;padding:28px;box-shadow:var(--shadow)}.login-card h1{margin:0 0 8px;font-size:32px}.login-card p{color:var(--muted);line-height:1.6}.demo-link{display:block;text-align:center;margin-top:14px;color:var(--navy);font-weight:800}.message{margin-top:14px;font-size:13px;color:var(--muted)}</style>
</head>
<body>
  <main class="login-card">
    <p class="eyebrow">כניסה מאובטחת</p><h1>גן מזור</h1><p>לאחר החיבור ל־Supabase יישלח קישור כניסה חד־פעמי למייל. כרגע אפשר להיכנס לדמו.</p>
    <form id="loginForm"><label>כתובת מייל<input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></label><button class="primary-button" type="submit">שליחת קישור כניסה</button></form>
    <a class="demo-link" href="index.html">כניסה למצב הדמו</a><div id="message" class="message"></div>
  </main>
  <script>
    // טוען תמיד את הגדרות Supabase מהגרסה העדכנית ביותר.
    document.write('<script src="config.js?v=' + Date.now() + '"><\\/script>');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');
    const button = form.querySelector('button[type="submit"]');

    function getConfig() {
      return window.GAN_MAZOR_CONFIG || {};
    }

    function connectionIsReady() {
      const config = getConfig();
      return Boolean(
        config.SUPABASE_URL &&
        config.SUPABASE_ANON_KEY &&
        config.SUPABASE_URL.endsWith('.supabase.co') &&
        config.SUPABASE_ANON_KEY.startsWith('sb_publishable_')
      );
    }

    if (connectionIsReady()) {
      message.textContent = 'החיבור מוכן. אפשר לשלוח קישור כניסה.';
    } else {
      message.textContent = 'הגדרות החיבור עדיין לא נטענו. רעננו את העמוד.';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!connectionIsReady()) {
        message.textContent = 'הגדרות החיבור עדיין לא נטענו. רעננו את העמוד.';
        return;
      }

      button.disabled = true;
      button.textContent = 'שולחת...';
      message.textContent = '';

      try {
        const config = getConfig();
        const client = window.supabase.createClient(
          config.SUPABASE_URL,
          config.SUPABASE_ANON_KEY
        );

        const redirectUrl = new URL('index.html', window.location.href).href;
        redirectUrl.search = '';

        const { error } = await client.auth.signInWithOtp({
          email: document.getElementById('email').value.trim(),
          options: { emailRedirectTo: redirectUrl.toString() }
        });

        if (error) throw error;
        message.textContent = 'הקישור נשלח. בדקו גם בתיקיית הספאם.';
      } catch (error) {
        console.error(error);
        message.textContent = error?.message || 'לא ניתן לשלוח כרגע.';
      } finally {
        button.disabled = false;
        button.textContent = 'שליחת קישור כניסה';
      }
    });
  </script>
</body>
</html>
